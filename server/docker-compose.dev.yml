services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: kmedia-indexer-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - INGEST_API_KEY=${INGEST_API_KEY:-test-key}
      - JWT_SECRET=${JWT_SECRET:-test-secret}
    volumes:
      - ../mnt/data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
