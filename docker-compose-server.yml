version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile-server
    container_name: kmedia-indexer-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - INGEST_API_KEY=${INGEST_API_KEY:-super-secret-worker-key}
      - DB_PATH=/data/indexer.db
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - indexer-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  indexer-data:
    driver: local
